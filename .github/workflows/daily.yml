name: Daily virality digest + site

# Runs the collector, rebuilds the static site in docs/ (GitHub Pages
# serves it from the main branch), and commits data + site back to the
# repo. 17:00 UTC lands ~9-10am Pacific (Actions schedules are UTC-only,
# so it drifts one hour across DST changes).
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect, score and render today's digest
        run: python3 run_daily.py
      - name: Build the site
        run: python3 build_site.py
      - name: Commit and push data + site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily digest $(date -u +%F)"
            git push
          fi
